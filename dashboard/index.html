<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="pageTitle"></title>
    <script>
      const THEME_STORAGE_KEY = 'agent-board.theme'
      const THEME_PREFERENCES = ['system', 'light', 'dark']
      const darkSchemeQuery = window.matchMedia('(prefers-color-scheme: dark)')

      const readStoredPreference = (key, allowed) => {
        try {
          const stored = localStorage.getItem(key)

          return allowed.includes(stored) ? stored : null
        } catch (error) {
          return null
        }
      }

      const storePreference = (key, value) => {
        try {
          localStorage.setItem(key, value)
        } catch (error) {
          console.warn(`agent-board: could not save ${key} (${error.message})`)
        }
      }

      let themePreference = readStoredPreference(THEME_STORAGE_KEY, THEME_PREFERENCES) ?? 'system'

      const applyTheme = () => {
        const isDark = themePreference === 'dark' || (themePreference === 'system' && darkSchemeQuery.matches)
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
      }

      darkSchemeQuery.addEventListener('change', applyTheme)
      applyTheme()
    </script>
    <style>
      :root {
        --page: #eef1f6;
        --surface: #ffffff;
        --surface-alt: #f5f7fb;
        --line: #d9dfe9;
        --line-soft: #e6eaf1;
        --ink: #0f1b2d;
        --muted: #4a5872;
        --mono: #24324a;
        --track: #e2e7ef;
        --tick: rgba(15, 27, 45, 0.16);
        --meter: #0f1b2d;
        --pace: #c2410c;
        --accent: #2457d6;
        --sub: #0f8b8d;
        --fail: #c2410c;
        --warn: #c2410c;
        --good: #0f8b8d;
        --done: #8592a8;
        --chip: #f0f3f8;
        --label-bg: rgba(255, 255, 255, 0.9);
        --focus: #2457d6;
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        --page: #0b111d;
        --surface: #121a2a;
        --surface-alt: #172136;
        --line: #243149;
        --line-soft: #1c2840;
        --ink: #e7ecf5;
        --muted: #9aa8c0;
        --mono: #c9d3e4;
        --track: #1e2a41;
        --tick: rgba(231, 236, 245, 0.14);
        --meter: #e7ecf5;
        --pace: #ff9a5c;
        --accent: #7397ff;
        --sub: #34b8ba;
        --fail: #ff9a5c;
        --warn: #ff9a5c;
        --good: #34b8ba;
        --done: #6b7890;
        --chip: #1c2840;
        --label-bg: rgba(18, 26, 42, 0.92);
        --focus: #7397ff;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums;
      }

      button {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      h1,
      h2,
      h3 {
        margin: 0;
      }

      .shell {
        max-width: 1440px;
        margin: 0 auto;
        padding: 28px 32px 48px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .masthead {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px 40px;
      }

      .title-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 20px;
      }

      .preferences {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 13px;
        color: var(--muted);
      }

      .preferences label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .preferences select {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 6px;
      }

      .masthead h1 {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
      }

      .summary .working-count {
        color: var(--accent);
        font-weight: 600;
      }

      .plan {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 280px;
        gap: 10px 36px;
      }

      .plan-window {
        width: 280px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .plan-figure {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        font-weight: 600;
      }

      .plan-percent {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .plan-foot {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 2px 12px;
        font-size: 13px;
        color: var(--muted);
      }

      .plan-foot .pace-under {
        color: var(--good);
        font-weight: 600;
      }

      .plan-foot .pace-over {
        color: var(--warn);
        font-weight: 600;
      }

      .meter {
        position: relative;
        height: 10px;
        margin-top: 2px;
      }

      .meter.small {
        height: 8px;
        margin-top: 0;
      }

      .meter-track {
        position: absolute;
        inset: 0;
        border-radius: 5px;
        background: var(--track);
        overflow: hidden;
      }

      .meter-track::before {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(25% - 1px),
          var(--tick) calc(25% - 1px),
          var(--tick) 25%
        );
      }

      .meter-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        border-radius: 5px;
        background: var(--meter);
      }

      .meter-fill.is-warning {
        background: var(--warn);
      }

      .pace-mark {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 3px;
        margin-left: -1px;
        border-radius: 2px;
        background: var(--pace);
        box-shadow: 0 0 0 2px var(--page);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px 24px 22px;
        min-width: 0;
      }

      .panel-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px 24px;
        margin-bottom: 16px;
      }

      .panel-head h2 {
        font-size: 18px;
        font-weight: 700;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        font-size: 13px;
        color: var(--muted);
      }

      .legend span {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .swatch-main {
        width: 18px;
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
      }

      .swatch-sub {
        width: 18px;
        height: 6px;
        border-radius: 3px;
        background: var(--sub);
      }

      .swatch-fail {
        width: 8px;
        height: 8px;
        transform: rotate(45deg);
        background: var(--fail);
      }

      .swatch-pace {
        width: 3px;
        height: 12px;
        border-radius: 2px;
        background: var(--pace);
      }

      .timeline-scroll {
        overflow-x: auto;
      }

      .timeline {
        min-width: 760px;
      }

      .lane,
      .axis {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 0 20px;
      }

      .axis {
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }

      .axis-marks {
        display: flex;
        justify-content: space-between;
      }

      .axis-marks .now {
        color: var(--ink);
        font-weight: 600;
      }

      .lane {
        padding: 12px 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .lane.is-selected {
        background: var(--surface-alt);
      }

      .lane-label {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        padding: 0 0 0 10px;
        border: 0;
        border-left: 3px solid transparent;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .lane.is-selected .lane-label {
        border-left-color: var(--accent);
      }

      .lane-project {
        font-weight: 700;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .lane-branch {
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .state {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      .state.working {
        color: var(--accent);
      }

      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 2px solid currentColor;
      }

      .state.working .dot {
        background: currentColor;
      }

      .state.stale .dot {
        border-style: dashed;
      }

      .lane-tracks {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        min-width: 0;
      }

      .track {
        position: relative;
        height: 18px;
        background: repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(33.333% - 1px),
          var(--line-soft) calc(33.333% - 1px),
          var(--line-soft) 33.333%
        );
      }

      .track.sub {
        height: 22px;
        background: none;
      }

      .turn {
        position: absolute;
        top: 2px;
        height: 14px;
        min-width: 3px;
        border-radius: 4px;
        background: var(--accent);
      }

      .agent-bar {
        position: absolute;
        top: 6px;
        height: 10px;
        min-width: 3px;
        border-radius: 3px;
        background: var(--sub);
      }

      .is-past {
        opacity: 0.5;
      }

      .failure-mark {
        position: absolute;
        top: 4px;
        width: 9px;
        height: 9px;
        margin-left: -4px;
        transform: rotate(45deg);
        background: var(--fail);
        outline: 2px solid var(--surface);
      }

      .now-line {
        position: absolute;
        top: -4px;
        bottom: -4px;
        right: 0;
        width: 2px;
        background: var(--ink);
      }

      .agent-label {
        position: absolute;
        top: 2px;
        padding: 0 6px;
        border-radius: 3px;
        background: var(--label-bg);
        font-size: 12px;
        white-space: nowrap;
      }

      .lower {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: flex-start;
      }

      .detail {
        flex: 999 1 560px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .log-panel {
        flex: 1 1 360px;
        padding-bottom: 12px;
      }

      .detail-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px 20px;
      }

      .detail-head h2 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .detail-head .origin {
        display: block;
        margin-top: 2px;
        font-size: 14px;
        color: var(--muted);
      }

      .detail-head .state {
        font-size: 15px;
      }

      .request {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 16px;
        border-radius: 10px;
        background: var(--surface-alt);
      }

      .request span:first-child {
        font-size: 13px;
        color: var(--muted);
      }

      .request p {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .request .command {
        font-size: 13px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      @media (max-width: 720px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        padding: 14px 16px;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
      }

      .stat-label,
      .stat-hint {
        font-size: 13px;
        color: var(--muted);
      }

      .stat-hint.is-warning {
        color: var(--warn);
        font-weight: 600;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .block {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .block h3 {
        font-size: 16px;
        font-weight: 700;
      }

      .table-box {
        overflow-x: auto;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th {
        padding: 10px 14px;
        background: var(--surface-alt);
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        text-align: left;
      }

      td {
        padding: 10px 14px;
        border-top: 1px solid var(--line-soft);
        vertical-align: top;
      }

      .numeric {
        text-align: right;
        white-space: nowrap;
      }

      .agents-table {
        min-width: 620px;
      }

      .usage-table {
        min-width: 520px;
      }

      .usage-table tr.total td {
        font-weight: 700;
      }

      tr.is-finished td {
        color: var(--muted);
      }

      tr.is-finished .state {
        color: var(--done);
      }

      .agent-model {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }

      .agents-table tbody tr {
        cursor: pointer;
      }

      .agents-table tbody tr:hover td {
        background: var(--surface-alt);
      }

      .agent-button {
        padding: 0;
        border: 0;
        background: transparent;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
        white-space: nowrap;
      }

      .alert {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        padding: 2px 10px;
        border: 1px solid var(--warn);
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--warn);
      }

      .agents-table .alert {
        margin-top: 6px;
      }

      .back-button {
        width: fit-content;
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 14px;
        font-weight: 600;
        color: var(--accent);
        cursor: pointer;
      }

      .agent-text {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .request .agent-text {
        font-size: 15px;
        font-weight: 400;
      }

      .answer {
        padding: 14px 16px;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
      }

      .command {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
        font-size: 12.5px;
        color: var(--mono);
        overflow-wrap: anywhere;
      }

      .log {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .log li {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 2px 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line-soft);
      }

      .log time {
        font-size: 13px;
        color: var(--muted);
      }

      .log-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .log-tool {
        font-weight: 700;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .log li.failed .log-tool,
      .log-failure {
        color: var(--fail);
      }

      .log-failure {
        font-size: 12px;
        font-weight: 600;
      }

      .chip {
        padding: 1px 7px;
        border-radius: 4px;
        background: var(--chip);
        color: var(--muted);
        font-size: 12px;
      }

      .log .command {
        display: block;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .empty {
        margin: 0;
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 10px;
        color: var(--muted);
      }

      .notice {
        margin: 0;
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid var(--fail);
        background: var(--surface);
      }

      .plan-note {
        display: flex;
        align-items: center;
        gap: 7px;
        grid-row: 2;
        grid-column: 1 / span 2;
        font-size: 12px;
        color: var(--muted);
      }

      .sessions-table .state,
      .sessions-table .model-cell {
        white-space: nowrap;
      }

      .sessions-table .command {
        display: block;
        max-width: 260px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
      }

      .kpi {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }

      .kpi-label,
      .kpi-hint {
        font-size: 13px;
        color: var(--muted);
      }

      .kpi-hint {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .kpi-hint.is-warning {
        color: var(--warn);
        font-weight: 600;
      }

      .kpi-value {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      .kpi-value .kpi-of {
        font-size: 16px;
        font-weight: 500;
        color: var(--muted);
      }

      .sessions-table {
        min-width: 960px;
      }

      .sessions-table tbody tr {
        cursor: pointer;
      }

      .sessions-table tbody tr:hover td {
        background: var(--surface-alt);
      }

      .sessions-table tr.is-selected td {
        background: var(--surface-alt);
      }

      .sessions-table tr.is-selected td:first-child {
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .session-button {
        display: block;
        max-width: 260px;
        padding: 0;
        border: 0;
        background: transparent;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .session-branch {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }

      .context-cell {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 96px;
      }

      .charts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }

      .bars {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 160px minmax(0, 1fr) 84px;
        align-items: center;
        gap: 12px;
        font-size: 14px;
      }

      .bar-row.is-clickable {
        cursor: pointer;
      }

      .bar-label {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .bar-track {
        height: 14px;
        border-radius: 4px;
        background: var(--track);
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        min-width: 2px;
        border-radius: 0 4px 4px 0;
        background: var(--done);
      }

      .bars.is-single .bar-fill,
      .bar-row.is-emphasis .bar-fill {
        background: var(--meter);
      }

      .bar-row.is-emphasis .bar-label {
        font-weight: 700;
      }

      .bar-value {
        text-align: right;
        white-space: nowrap;
      }

      .quiet {
        margin: 14px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 1100px) {
        .kpis {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 900px) {
        .charts {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 720px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .kpi-value {
          font-size: 24px;
        }

        .bar-row {
          grid-template-columns: 110px minmax(0, 1fr) 72px;
        }
      }

      @media (max-width: 720px) {
        .shell {
          padding: 20px 16px 32px;
          gap: 20px;
        }

        .plan {
          grid-auto-flow: row;
          grid-auto-columns: minmax(0, 1fr);
        }

        .plan-window {
          width: 100%;
        }

        .plan-note {
          grid-row: auto;
          grid-column: 1;
        }

        .panel {
          padding: 16px;
        }

        .timeline {

          laneBranch: (branch, since) => `${branch}, since ${since}`,
          failureMarkTitle: (tool, time) => `${tool} failed at ${time}`,
          kpiWorkingNow: 'Working now',
          kpiOf: total => ` of ${total}`,
          activeSubagents: count => `${count} active ${count === 1 ? 'subagent' : 'subagents'}`,
          kpiCost: 'Cost of open sessions',
          kpiCostliest: (project, cost) => `max ${project} · ${cost}`,
          outputTokens: 'Output tokens',
          kpiTokensHint: (input, cacheRead) => `input ${input} · cache read ${cacheRead}`,
          turns: 'Turns',
          noFailures: 'no tool failed in the last 30 min',
          failuresRecent: count => `${count} ${count === 1 ? 'tool' : 'tools'} failed in the last 30 min`,
          kpiHighestContext: 'Highest context',
          noContextData: 'no context data',
          colState: 'Status',
          colSession: 'Session',
          colModel: 'Model',
          colOpened: 'Opened',

          noSessionPublishing: 'No session is publishing its status.',
          noSessionPublishingHint: 'No session is publishing its status. Open Claude Code with agent-board loaded and it will show up here.',
          noSessions: 'No sessions.',
          noTurnsFinished: 'No turn has finished yet.',
          noRecentActivity: 'No session had activity in the last 30 minutes.',

          now: 'now',
          quietSessions: (count, list) => `${count} ${count === 1 ? 'session' : 'sessions'} with no activity in this range: ${list}`,
          contextUsed: 'Context used',
          compactingSoon: 'Compacting soon',
          noSubagents: 'This session has not launched any subagents.',
          noTurnsInSession: 'No turn has finished in this session yet.',
          pickSessionDetail: 'Pick a session in the timeline to see its details.',
          openedOrigin: (branch, when, isToday) => `${branch}, opened ${isToday ? 'at ' : ''}${when}`,
          requestCurrent: 'Current request',
          requestLast: 'Last request',
          noRequests: 'No requests in this session yet.',
          sessionCost: 'Session cost',
          subagents: 'Subagents',
          tokensByModel: 'Tokens by model',
          pickSessionLog: 'Pick a session to see its log.',
          noToolsYet: 'This session has not used any tools yet.',
          logFailed: 'Failed',
          openAgent: (type, description) => `Show the detail of ${type}: ${description}`,
          backToSession: project => `← Back to ${project}`,
          agentOrigin: (model, project) => `${model}, launched from ${project}`,
          agentPrompt: 'Asked to',
          agentAnswer: 'Answer',
          noAnswerYet: 'No answer yet.',
          agentTools: 'Tools',
          agentErrorsInRow: 'Errors in a row',
          agentTime: 'Time',
          agentModel: 'Model',
          agentNoToolsYet: 'This agent has not used any tools yet.',
          alertSlowTool: (tool, duration) => `${tool} running for ${duration}`,
          alertQuiet: duration => `No activity for ${duration}`,
          alertFailing: errors => `${errors} errors in a row`,
          serverResponded: status => `the server responded ${status}`,
          connectionLost: detail => `Cannot reach the agent-board server (${detail}). Restart it with /agent-board web.`,
        },
      }
      const LOCALES = { es: 'es-CL', en: 'en-US' }
      const SUPPORTED_LANGUAGES = Object.keys(STRINGS)

      const LANGUAGE_STORAGE_KEY = 'agent-board.language'

      const resolveLanguage = () => {
        const stored = readStoredPreference(LANGUAGE_STORAGE_KEY, SUPPORTED_LANGUAGES)

        if (stored !== null) {
          return stored
        }

        const requested = new URLSearchParams(location.search).get('lang')?.toLowerCase()

        if (SUPPORTED_LANGUAGES.includes(requested)) {
          return requested
        }

        return navigator.language.toLowerCase().startsWith('es') ? 'es' : 'en'
      }

      let language = resolveLanguage()
      let locale = LOCALES[language]
      document.documentElement.lang = language

      const t = (key, ...args) => {
        const entry = STRINGS[language][key]

        return typeof entry === 'function' ? entry(...args) : entry
      }

      const applyStaticTexts = () => {
        for (const node of document.querySelectorAll('[data-i18n]')) {
          node.textContent = t(node.dataset.i18n)
        }

        for (const node of document.querySelectorAll('[data-i18n-aria-label]')) {
          node.setAttribute('aria-label', t(node.dataset.i18nAriaLabel))
        }
      }

      const POLL_MS = 2000
      const STALE_AFTER_MS = 20000
      const TIMELINE_MS = 30 * 60_000
      const CONTEXT_WARNING_PERCENT = 80
      const LOG_LIMIT = 20
      const LABEL_FLIP_PERCENT = 68
      const AGENT_STUCK_AFTER_MS = 3 * 60_000
      const AGENT_FAILING_AFTER_ERRORS = 3
      const ACTIVE_AGENT_STATUSES = new Set(['pending', 'running', 'waiting'])
      const AGENT_STATUS_KEYS = {
        pending: 'agentPending',
        running: 'agentRunning',
        waiting: 'agentWaiting',
        idle: 'agentIdle',
        completed: 'agentCompleted',
        failed: 'agentFailed',
        killed: 'agentKilled',
      }
      const RATE_LIMITS = {
        five_hour: { nameKey: 'rateFiveHour', lengthMs: 5 * 60 * 60_000 },
        seven_day: { nameKey: 'rateSevenDay', lengthMs: 7 * 24 * 60 * 60_000 },
      }
      const TOKEN_COLUMNS = [
        ['input', 'tokenInput'],
        ['output', 'tokenOutput'],
        ['cacheRead', 'tokenCacheRead'],
        ['cacheWrite', 'tokenCacheWrite'],
      ]

      const state = {
        sessions: [],
        now: Date.now(),
        selectedId: decodeURIComponent(location.hash.slice(1)) || null,
        selectedAgentId: null,
        hasLoaded: false,
      }

      const el = (tag, attributes = {}, ...children) => {
        const node = document.createElement(tag)

        for (const [name, value] of Object.entries(attributes)) {
          if (value === null || value === undefined || value === false) {
            continue
          }

          if (name === 'className') {
            node.className = value
          } else if (name === 'style') {
            Object.assign(node.style, value)
          } else if (name.startsWith('on')) {
            node.addEventListener(name.slice(2).toLowerCase(), value)
          } else {
            node.setAttribute(name, value === true ? '' : value)
          }
        }

        for (const child of children.flat()) {
          if (child !== null && child !== undefined && child !== false) {
            node.append(child instanceof Node ? child : String(child))
          }
        }

        return node
      }

      const decimal = (value, digits) => value.toFixed(digits).replace('.', t('decimalSeparator'))

      const formatPercent = value => t('percent', value)

      const agentStatusLabel = status => (AGENT_STATUS_KEYS[status] === undefined ? status : t(AGENT_STATUS_KEYS[status]))

      const formatDuration = ms => {
        const totalMinutes = Math.max(0, Math.floor(ms / 60_000))
        const days = Math.floor(totalMinutes / 1440)
        const hours = Math.floor((totalMinutes % 1440) / 60)
        const minutes = totalMinutes % 60

        if (days > 0) {
          return `${t('days', days)} ${hours} h`
        }

        if (hours > 0) {
          return `${hours} h ${minutes} min`
        }

        if (minutes > 0) {
          return `${minutes} min`
        }

        return `${Math.max(0, Math.floor(ms / 1000))} s`
      }

      const formatTokens = count => {
        if (count >= 1_000_000) {
          return `${decimal(count / 1_000_000, 1)} M`
        }

        return count >= 1000 ? `${decimal(count / 1000, 1)} k` : String(count)
      }

      const formatUsd = amount => t('usd', decimal(amount, 2))
      const formatClock = at => new Date(at).toTimeString().slice(0, 5)
      const DAY_MS = 86_400_000
      const isSameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString()

      const formatWhen = at => {
        if (isSameDay(at, state.now)) {
          return formatClock(at)
        }

        if (isSameDay(at, state.now - DAY_MS)) {
          return `${t('yesterday')} ${formatClock(at)}`
        }

        return `${new Date(at).toLocaleDateString(locale, { weekday: 'short', day: 'numeric' })} ${formatClock(at)}`
      }
      const shortModel = model => (model ?? '').replace(/^claude-/, '')
      const clampPercent = value => Math.max(0, Math.min(100, value))
      const isActiveAgent = agent => ACTIVE_AGENT_STATUSES.has(agent.status)

      const normalizeAgent = agent => ({
        ...agent,
        prompt: agent.prompt ?? '',
        answer: agent.answer ?? null,
        recent: Array.isArray(agent.recent) ? agent.recent : [],
        lastActivityAt: agent.lastActivityAt ?? agent.startedAt,
        consecutiveErrors: agent.consecutiveErrors ?? 0,
      })

      const normalizeSession = session => ({ ...session, agents: (session.agents ?? []).map(normalizeAgent) })

      const agentAlertText = agent => {
        if (agent.status !== 'running') {
          return null
        }

        if (agent.consecutiveErrors >= AGENT_FAILING_AFTER_ERRORS) {
          return t('alertFailing', agent.consecutiveErrors)
        }

        if (agent.currentTool !== null) {
          const elapsed = state.now - agent.currentTool.startedAt

          return elapsed >= AGENT_STUCK_AFTER_MS ? t('alertSlowTool', agent.currentTool.tool, formatDuration(elapsed)) : null
        }

        const quiet = state.now - agent.lastActivityAt

        return quiet >= AGENT_STUCK_AFTER_MS ? t('alertQuiet', formatDuration(quiet)) : null
      }

      const alertBadge = agent => {
        const text = agentAlertText(agent)

        return text === null ? null : el('span', { className: 'alert', role: 'status' }, el('span', { 'aria-hidden': 'true' }, '⚠'), text)
      }

      const health = session => {
        if (state.now - session.updatedAt > STALE_AFTER_MS) {
          return 'stale'
        }

        return session.isWorking ? 'working' : 'idle'
      }

      const stateText = session => {
        const current = health(session)

        if (current === 'stale') {
          return t('stateStale', formatDuration(state.now - session.updatedAt))
        }

        if (current === 'working') {
          return session.turnStartedAt === null
            ? t('stateWorking')
            : t('stateWorkingFor', formatDuration(state.now - session.turnStartedAt))
        }

        return t('stateIdle')
      }

      const stateBadge = session =>
        el('span', { className: `state ${health(session)}` }, el('span', { className: 'dot', 'aria-hidden': 'true' }), stateText(session))

      const currentTool = session => {
        const runningAgent = session.agents.find(agent => isActiveAgent(agent) && agent.currentTool !== null)

        return session.currentTool ?? runningAgent?.currentTool ?? null
      }

      const totalUsage = session =>
        Object.values(session.usageByModel ?? {}).reduce(
          (sum, usage) => ({
            input: sum.input + usage.input,
            output: sum.output + usage.output,
            cacheRead: sum.cacheRead + usage.cacheRead,
            cacheWrite: sum.cacheWrite + usage.cacheWrite,
          }),
          { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
        )

      const lastActivityAt = session =>
        Math.max(
          session.startedAt,
          session.turnStartedAt ?? 0,
          session.recent[0]?.at ?? 0,
          ...session.turnHistory.map(turn => turn.endedAt),
          ...session.agents.map(agent => agent.endedAt ?? 0),
        )

      const sortSessions = sessions =>
        [...sessions].sort((a, b) => {
          const workingGap = Number(health(b) === 'working') - Number(health(a) === 'working')

          return workingGap || lastActivityAt(b) - lastActivityAt(a) || a.id.localeCompare(b.id)
        })

      const sumUsage = usages =>
        usages.reduce(
          (sum, usage) => ({
            input: sum.input + usage.input,
            output: sum.output + usage.output,
            cacheRead: sum.cacheRead + usage.cacheRead,
            cacheWrite: sum.cacheWrite + usage.cacheWrite,
          }),
          { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 },
        )

      const meter = (percent, { isWarning = false, pacePercent = null, size = '' } = {}) =>
        el(
          'div',
          { className: `meter ${size}`, 'aria-hidden': 'true' },
          el(
            'div',
            { className: 'meter-track' },
            el('div', { className: `meter-fill ${isWarning ? 'is-warning' : ''}`, style: { width: `${clampPercent(percent)}%` } }),
          ),
          pacePercent === null ? null : el('div', { className: 'pace-mark', style: { left: `${clampPercent(pacePercent)}%` } }),
        )

      const RATE_LIMIT_ORDER = ['five_hour', 'seven_day']

      const resetTime = window => (window.resetsAt === null ? Number.NEGATIVE_INFINITY : Date.parse(window.resetsAt))

      const isNewerWindow = (candidate, current) =>
        resetTime(candidate) > resetTime(current) ||
        (resetTime(candidate) === resetTime(current) && candidate.percentUsed > current.percentUsed)

      const kindOrder = kind => {
        const index = RATE_LIMIT_ORDER.indexOf(kind)

        return index === -1 ? RATE_LIMIT_ORDER.length : index
      }

      const latestRateLimits = () => {
        const byKind = new Map()

        for (const window of state.sessions.flatMap(session => session.rateLimits ?? [])) {
          if (window.resetsAt !== null && resetTime(window) <= state.now) {
            continue
          }

          const current = byKind.get(window.kind)

          if (current === undefined || isNewerWindow(window, current)) {
            byKind.set(window.kind, window)
          }
        }

        return [...byKind.values()].sort((a, b) => kindOrder(a.kind) - kindOrder(b.kind))
      }

      const planWindow = window => {
        const definition = RATE_LIMITS[window.kind] ?? { nameKey: null, lengthMs: null }
        const name = definition.nameKey === null ? window.kind : t(definition.nameKey)
        const resetAt = window.resetsAt === null ? Number.NaN : Date.parse(window.resetsAt)
        const hasReset = !Number.isNaN(resetAt)
        const pacePercent =
          hasReset && definition.lengthMs !== null
            ? clampPercent(100 - ((resetAt - state.now) / definition.lengthMs) * 100)
            : null
        const gap = pacePercent === null ? null : Math.round(pacePercent - window.percentUsed)
        const paceText =
          gap === null
            ? null
            : gap >= 0
              ? el('span', { className: 'pace-under' }, t('paceUnder', gap))
              : el('span', { className: 'pace-over' }, t('paceOver', Math.abs(gap)))

        return el(
          'div',
          {
            className: 'plan-window',
            role: 'group',
            'aria-label': t('planWindowAria', name, formatPercent(window.percentUsed)),
          },
          el('div', { className: 'plan-figure' }, el('span', {}, name), el('span', { className: 'plan-percent' }, formatPercent(window.percentUsed))),
          meter(window.percentUsed, { pacePercent }),
          el(
            'div',
            { className: 'plan-foot' },
            paceText,
            hasReset ? el('span', {}, t('resetsIn', formatDuration(resetAt - state.now))) : null,
          ),
        )
      }

      const renderHeader = sessions => {
        const working = sessions.filter(session => health(session) === 'working').length

        document.getElementById('summary').replaceChildren(
          ...[
            el('span', {}, t('openSessions', sessions.length)),
            working === 0 ? null : el('span', { className: 'working-count' }, t('workingNowCount', working)),
            el('span', {}, t('updatedAt', new Date(state.now).toTimeString().slice(0, 8))),
          ].filter(Boolean),
        )
        const windows = latestRateLimits()
        document
          .getElementById('plan')
          .replaceChildren(
            ...windows.map(planWindow),
            ...(windows.length === 0
              ? []
              : [el('span', { className: 'plan-note' }, el('span', { className: 'swatch-pace', 'aria-hidden': 'true' }), t('paceNote'))]),
          )
        document.title = working === 0 ? t('pageTitle') : t('pageTitleWorking', working)
      }

      const timelinePercent = at => clampPercent(((at - (state.now - TIMELINE_MS)) / TIMELINE_MS) * 100)

      const spanStyle = (startedAt, endedAt) => {
        const left = timelinePercent(startedAt)

        return { left: `${left}%`, width: `${Math.max(0, timelinePercent(endedAt) - left)}%` }
      }

      const isVisible = (startedAt, endedAt) => endedAt >= state.now - TIMELINE_MS && startedAt <= state.now

      const sessionTurns = session => [
        ...(session.turnHistory ?? []).map(turn => ({ ...turn, isCurrent: false })),
        ...(session.turnStartedAt === null ? [] : [{ startedAt: session.turnStartedAt, endedAt: state.now, isCurrent: true }]),
      ]

      const agentLabel = agent => {
        const status = isActiveAgent(agent) ? agent.description : agentStatusLabel(agent.status).toLowerCase()

        return `${agent.type}, ${status}`
      }

      const agentLane = agent => {
        const endedAt = agent.endedAt ?? (isActiveAgent(agent) ? state.now : agent.startedAt)
        const start = timelinePercent(agent.startedAt)
        const end = timelinePercent(endedAt)
        const labelStyle = end < LABEL_FLIP_PERCENT ? { left: `calc(${end}% + 6px)` } : start > 0 ? { right: `calc(${100 - start}% + 6px)` } : { left: '6px' }

        return el(
          'div',
          { className: 'track sub' },
          el('div', { className: `agent-bar ${isActiveAgent(agent) ? '' : 'is-past'}`, style: spanStyle(agent.startedAt, endedAt) }),
          el('span', { className: 'agent-label', style: labelStyle }, agentLabel(agent)),
        )
      }

      const selectSession = id => {
        if (id !== state.selectedId) {
          state.selectedAgentId = null
        }

        state.selectedId = id
        history.replaceState(null, '', `#${encodeURIComponent(id)}`)
        render()
      }

      const selectAgent = id => {
        state.selectedAgentId = id
        render()
        document.querySelector('[data-back]')?.focus({ preventScroll: true })
      }

      const closeAgent = () => {
        const agentId = state.selectedAgentId
        state.selectedAgentId = null
        render()
        document.querySelector(`[data-agent="${CSS.escape(agentId)}"]`)?.focus({ preventScroll: true })
      }

      const lane = session => {
        const turns = sessionTurns(session).filter(turn => isVisible(turn.startedAt, turn.endedAt))
        const failures = session.recent.filter(entry => entry.isError && entry.at >= state.now - TIMELINE_MS)
        const agents = session.agents.filter(agent =>
          isVisible(agent.startedAt, agent.endedAt ?? (isActiveAgent(agent) ? state.now : agent.startedAt)),
        )
        const isSelected = session.id === state.selectedId

        return el(
          'div',
          { className: `lane ${isSelected ? 'is-selected' : ''}` },
          el(
            'button',
            {
              type: 'button',
              className: 'lane-label',
              'data-session': session.id,
              'aria-pressed': isSelected ? 'true' : 'false',
              onClick: () => selectSession(session.id),
            },
            el('span', { className: 'lane-project' }, session.project),
            el('span', { className: 'lane-branch' }, t('laneBranch', session.branch ?? t('noBranch'), formatWhen(session.startedAt))),
            stateBadge(session),
          ),
          el(
            'div',
            { className: 'lane-tracks' },
            el(
              'div',
              { className: 'track' },
              turns.map(turn => el('div', { className: `turn ${turn.isCurrent ? '' : 'is-past'}`, style: spanStyle(turn.startedAt, turn.endedAt) })),
              failures.map(entry =>
                el('div', { className: 'failure-mark', title: t('failureMarkTitle', entry.tool, formatClock(entry.at)), style: { left: `${timelinePercent(entry.at)}%` } }),
              ),
              el('div', { className: 'now-line' }),
            ),
            agents.map(agentLane),
          ),
        )
      }

      const hasRecentActivity = session =>
        health(session) === 'working' ||
        sessionTurns(session).some(turn => isVisible(turn.startedAt, turn.endedAt)) ||
        session.agents.some(agent => isVisible(agent.startedAt, agent.endedAt ?? (isActiveAgent(agent) ? state.now : agent.startedAt))) ||
        session.recent.some(entry => entry.at >= state.now - TIMELINE_MS)

      const kpi = (label, value, hint = null, { isWarning = false, extra = null } = {}) =>
        el(
          'div',
          { className: 'kpi' },
          el('span', { className: 'kpi-label' }, label),
          el('span', { className: 'kpi-value' }, value),
          extra,
          hint === null ? null : el('span', { className: `kpi-hint ${isWarning ? 'is-warning' : ''}`, title: hint }, hint),
        )

      const renderKpis = sessions => {
        const working = sessions.filter(session => health(session) === 'working').length
        const activeAgents = sessions.flatMap(session => session.agents).filter(isActiveAgent).length
        const cost = sessions.reduce((sum, session) => sum + (session.costUsd ?? 0), 0)
        const costliest = [...sessions].sort((a, b) => (b.costUsd ?? 0) - (a.costUsd ?? 0))[0]
        const usage = sumUsage(sessions.map(totalUsage))
        const turns = sessions.reduce((sum, session) => sum + session.turns, 0)
        const failures = sessions.flatMap(session => session.recent).filter(entry => entry.isError && entry.at >= state.now - TIMELINE_MS).length
        const withContext = sessions.filter(session => session.contextPercent !== null)
        const fullest = [...withContext].sort((a, b) => b.contextPercent - a.contextPercent)[0]
        const fullestPercent = fullest === undefined ? null : Math.round(fullest.contextPercent)

        document.getElementById('kpis').replaceChildren(
          kpi(
            t('kpiWorkingNow'),
            el('span', {}, String(working), el('span', { className: 'kpi-of' }, t('kpiOf', sessions.length))),
            t('activeSubagents', activeAgents),
          ),
          kpi(
            t('kpiCost'),
            formatUsd(cost),
            costliest === undefined || costliest.costUsd === null ? null : t('kpiCostliest', costliest.project, formatUsd(costliest.costUsd)),
          ),
          kpi(t('outputTokens'), formatTokens(usage.output), t('kpiTokensHint', formatTokens(usage.input), formatTokens(usage.cacheRead))),
          kpi(t('turns'), String(turns), failures === 0 ? t('noFailures') : t('failuresRecent', failures), {
            isWarning: failures > 0,
          }),
          kpi(
            t('kpiHighestContext'),
            fullestPercent === null ? '—' : formatPercent(fullestPercent),
            fullest === undefined ? t('noContextData') : fullest.project,
            {
              isWarning: fullestPercent !== null && fullestPercent >= CONTEXT_WARNING_PERCENT,
              extra: fullestPercent === null ? null : meter(fullestPercent, { isWarning: fullestPercent >= CONTEXT_WARNING_PERCENT, size: 'small' }),
            },
          ),
        )
      }

      const sessionRow = session => {
        const isSelected = session.id === state.selectedId
        const activeAgents = session.agents.filter(isActiveAgent).length
        const contextPercent = session.contextPercent === null ? null : Math.round(session.contextPercent)
        const tool = currentTool(session)

        return el(
          'tr',
          { className: isSelected ? 'is-selected' : '', 'aria-selected': isSelected ? 'true' : 'false', onClick: () => selectSession(session.id) },
          el('td', {}, stateBadge(session)),
          el(
            'td',
            {},
            el('button', { type: 'button', className: 'session-button', 'data-session': session.id }, session.project),
            el('span', { className: 'session-branch' }, session.branch ?? t('noBranch')),
            tool === null ? null : el('span', { className: 'command', title: `${tool.tool} ${tool.summary}` }, `${tool.tool} ${tool.summary}`),
          ),
          el('td', { className: 'model-cell' }, shortModel(session.model)),
          el('td', { className: 'numeric' }, formatWhen(session.startedAt)),
          el('td', { className: 'numeric' }, t('ago', formatDuration(state.now - lastActivityAt(session)))),
          el('td', { className: 'numeric' }, String(session.turns)),
          el('td', { className: 'numeric' }, session.agents.length === 0 ? '—' : `${activeAgents} / ${session.agents.length}`),
          el(
            'td',
            {},
            contextPercent === null
              ? '—'
              : el(
                  'div',
                  { className: 'context-cell' },
                  el('span', {}, formatPercent(contextPercent)),
                  meter(contextPercent, { isWarning: contextPercent >= CONTEXT_WARNING_PERCENT, size: 'small' }),
                ),
          ),
          el('td', { className: 'numeric' }, session.costUsd === null ? '—' : formatUsd(session.costUsd)),
        )
      }

      const renderSessions = sessions => {
        const target = document.getElementById('sessions')

        if (sessions.length === 0) {
          target.replaceChildren(el('p', { className: 'empty' }, state.hasLoaded ? t('noSessionPublishing') : t('searching')))

          return
        }

        target.replaceChildren(
          el(
            'div',
            { className: 'table-box', 'data-scroll-key': 'sessions' },
            el(
              'table',
              { className: 'sessions-table' },
              el(
                'thead',
                {},
                el(
                  'tr',
                  {},
                  el('th', {}, t('colState')),
                  el('th', {}, t('colSession')),
                  el('th', {}, t('colModel')),
                  el('th', { className: 'numeric' }, t('colOpened')),
                  el('th', { className: 'numeric' }, t('colLastActivity')),
                  el('th', { className: 'numeric' }, t('turns')),
                  el('th', { className: 'numeric' }, t('colAgents')),
                  el('th', {}, t('colContext')),
                  el('th', { className: 'numeric' }, t('colCost')),
                ),
              ),
              el('tbody', {}, sessions.map(sessionRow)),
            ),
          ),
        )
      }

      const barChart = ({ rows, format, emphasisKey = null, onSelect = null }) => {
        const max = Math.max(0, ...rows.map(row => row.value))

        return el(
          'div',
          { className: `bars ${emphasisKey === null ? 'is-single' : ''}` },
          rows.map(row =>
            el(
              'div',
              {
                className: `bar-row ${row.key === emphasisKey ? 'is-emphasis' : ''} ${onSelect === null ? '' : 'is-clickable'}`,
                title: `${row.label}: ${format(row.value)}`,
                onClick: onSelect === null ? null : () => onSelect(row),
              },
              el('span', { className: 'bar-label' }, row.label),
              el('div', { className: 'bar-track' }, el('div', { className: 'bar-fill', style: { width: `${max === 0 ? 0 : (row.value / max) * 100}%` } })),
              el('span', { className: 'bar-value' }, format(row.value)),
            ),
          ),
        )
      }

      const renderCharts = sessions => {
        const costTarget = document.getElementById('cost-chart')
        const modelsTarget = document.getElementById('models-chart')

        if (sessions.length === 0) {
          costTarget.replaceChildren(el('p', { className: 'empty' }, t('noSessions')))
          modelsTarget.replaceChildren(el('p', { className: 'empty' }, t('noSessions')))

          return
        }

        const costByProject = new Map()

        for (const session of sessions) {
          const entry = costByProject.get(session.project) ?? { key: session.project, label: session.project, value: 0, sessionIds: [] }
          entry.value += session.costUsd ?? 0
          entry.sessionIds.push(session.id)
          costByProject.set(session.project, entry)
        }

        const selected = sessions.find(session => session.id === state.selectedId)
        const costRows = [...costByProject.values()].sort((a, b) => b.value - a.value)
        costTarget.replaceChildren(
          barChart({
            rows: costRows,
            format: formatUsd,
            emphasisKey: selected?.project ?? null,
            onSelect: row => selectSession(row.sessionIds[0]),
          }),
        )

        const outputByModel = new Map()

        for (const [model, usage] of sessions.flatMap(session => Object.entries(session.usageByModel ?? {}))) {
          outputByModel.set(model, (outputByModel.get(model) ?? 0) + usage.output)
        }

        const modelRows = [...outputByModel.entries()].map(([model, value]) => ({ key: model, label: shortModel(model), value })).sort((a, b) => b.value - a.value)
        modelsTarget.replaceChildren(modelRows.length === 0 ? el('p', { className: 'empty' }, t('noTurnsFinished')) : barChart({ rows: modelRows, format: formatTokens }))
      }

      const renderTimeline = sessions => {
        const timeline = document.getElementById('timeline')

        if (sessions.length === 0) {
          timeline.replaceChildren(
            el(
              'p',
              { className: 'empty' },
              state.hasLoaded ? t('noSessionPublishingHint') : t('searching'),
            ),
          )

          return
        }

        const active = sessions.filter(hasRecentActivity)
        const quiet = sessions.filter(session => !hasRecentActivity(session))

        timeline.replaceChildren(
          active.length === 0
            ? el('p', { className: 'empty' }, t('noRecentActivity'))
            : el(
                'div',
                {},
                el(
                  'div',
                  { className: 'axis' },
                  el('span', {}),
                  el('div', { className: 'axis-marks' }, el('span', {}, t('minutesAgo', 30)), el('span', {}, t('minutesAgo', 20)), el('span', {}, t('minutesAgo', 10)), el('span', { className: 'now' }, t('now'))),
                ),
                ...active.map(lane),
              ),
          ...(quiet.length === 0
            ? []
            : [
                el(
                  'p',
                  { className: 'quiet' },
                  t('quietSessions', quiet.length, quiet.map(session => `${session.project} (${formatWhen(session.startedAt)})`).join(', ')),
                ),
              ]),
        )
      }

      const stat = (label, value, extra = null) =>
        el('div', { className: 'stat' }, el('span', { className: 'stat-label' }, label), el('span', { className: 'stat-value' }, value), extra)

      const contextStat = session => {
        if (session.contextPercent === null) {
          return stat(t('contextUsed'), '—')
        }

        const percent = Math.round(session.contextPercent)
        const isWarning = percent >= CONTEXT_WARNING_PERCENT

        return stat(
          t('contextUsed'),
          formatPercent(percent),
          el(
            'div',
            { className: 'block', style: { gap: '6px' } },
            meter(percent, { isWarning, size: 'small' }),
            isWarning ? el('span', { className: 'stat-hint is-warning' }, t('compactingSoon')) : null,
          ),
        )
      }

      const agentsTable = session => {
        if (session.agents.length === 0) {
          return el('p', { className: 'empty' }, t('noSubagents'))
        }

        return el(
          'div',
          { className: 'table-box', 'data-scroll-key': 'agents' },
          el(
            'table',
            { className: 'agents-table' },
            el(
              'thead',
              {},
              el('tr', {}, el('th', {}, t('colState')), el('th', {}, t('colAgent')), el('th', {}, t('colTask')), el('th', {}, t('colDoingNow')), el('th', { className: 'numeric' }, t('colTime'))),
            ),
            el(
              'tbody',
              {},
              session.agents.map(agent => {
                const isActive = isActiveAgent(agent)

                return el(
                  'tr',
                  { className: isActive ? '' : 'is-finished', onClick: () => selectAgent(agent.id) },
                  el(
                    'td',
                    {},
                    el(
                      'span',
                      { className: `state ${isActive ? 'working' : 'idle'}` },
                      el('span', { className: 'dot', 'aria-hidden': 'true' }),
                      agentStatusLabel(agent.status),
                    ),
                  ),
                  el(
                    'td',
                    {},
                    el(
                      'button',
                      { type: 'button', className: 'agent-button', 'data-agent': agent.id, 'aria-label': t('openAgent', agent.type, agent.description) },
                      agent.type,
                    ),
                    el('span', { className: 'agent-model' }, shortModel(agent.model)),
                  ),
                  el('td', {}, agent.description),
                  el(
                    'td',
                    {},
                    agent.currentTool === null ? '—' : el('span', { className: 'command' }, `${agent.currentTool.tool} ${agent.currentTool.summary}`),
                    alertBadge(agent),
                  ),
                  el('td', { className: 'numeric' }, formatDuration((agent.endedAt ?? state.now) - agent.startedAt)),
                )
              }),
            ),
          ),
        )
      }

      const usageTable = session => {
        const models = Object.entries(session.usageByModel ?? {})

        if (models.length === 0) {
          return el('p', { className: 'empty' }, t('noTurnsInSession'))
        }

        const row = (name, usage, className = '') =>
          el('tr', { className }, el('td', {}, name), TOKEN_COLUMNS.map(([key]) => el('td', { className: 'numeric' }, formatTokens(usage[key]))))

        return el(
          'div',
          { className: 'table-box', 'data-scroll-key': 'usage' },
          el(
            'table',
            { className: 'usage-table' },
            el('thead', {}, el('tr', {}, el('th', {}, t('colModel')), TOKEN_COLUMNS.map(([, labelKey]) => el('th', { className: 'numeric' }, t(labelKey))))),
            el(
              'tbody',
              {},
              models.map(([model, usage]) => row(shortModel(model), usage)),
              models.length > 1 ? row(t('total'), totalUsage(session), 'total') : null,
            ),
          ),
        )
      }

      const agentStateBadge = agent => {
        const isActive = isActiveAgent(agent)
        const label = isActive
          ? `${agentStatusLabel(agent.status)} · ${formatDuration(state.now - agent.startedAt)}`
          : agentStatusLabel(agent.status)

        return el('span', { className: `state ${isActive ? 'working' : 'idle'}` }, el('span', { className: 'dot', 'aria-hidden': 'true' }), label)
      }

      const renderAgentDetail = (detail, session, agent) => {
        detail.replaceChildren(
          ...[
            el('button', { type: 'button', className: 'back-button', 'data-back': 'true', onClick: closeAgent }, t('backToSession', session.project)),
            el(
              'div',
              { className: 'detail-head' },
              el('div', {}, el('h2', {}, `${agent.type} · ${agent.description}`), el('span', { className: 'origin' }, t('agentOrigin', shortModel(agent.model), session.project))),
              agentStateBadge(agent),
            ),
            alertBadge(agent),
            el(
              'div',
              { className: 'request' },
              el('span', {}, t('agentPrompt')),
              el('p', { className: 'agent-text' }, agent.prompt === '' ? agent.description : agent.prompt),
              agent.currentTool === null ? null : el('span', { className: 'command' }, `${agent.currentTool.tool} ${agent.currentTool.summary}`),
            ),
            el(
              'div',
              { className: 'stats' },
              stat(t('agentTime'), formatDuration((agent.endedAt ?? state.now) - agent.startedAt)),
              stat(t('agentTools'), String(agent.toolCount)),
              stat(t('agentErrorsInRow'), String(agent.consecutiveErrors)),
              stat(t('agentModel'), shortModel(agent.model)),
            ),
            el(
              'div',
              { className: 'block' },
              el('h3', {}, t('agentAnswer')),
              agent.answer === null
                ? el('p', { className: 'empty' }, t('noAnswerYet'))
                : el('div', { className: 'answer' }, el('p', { className: 'agent-text' }, agent.answer)),
            ),
          ].filter(Boolean),
        )
      }

      const renderDetail = (session, agent) => {
        const detail = document.getElementById('detail')

        if (session === undefined) {
          detail.replaceChildren(el('p', { className: 'empty' }, t('pickSessionDetail')))

          return
        }

        if (agent !== undefined) {
          renderAgentDetail(detail, session, agent)

          return
        }

        const tool = currentTool(session)

        detail.replaceChildren(
          el(
            'div',
            { className: 'detail-head' },
            el('div', {}, el('h2', {}, session.project), el('span', { className: 'origin' }, t('openedOrigin', session.branch ?? t('noBranch'), formatWhen(session.startedAt), isSameDay(session.startedAt, state.now)))),
            stateBadge(session),
          ),
          el(
            'div',
            { className: 'request' },
            el('span', {}, session.isWorking ? t('requestCurrent') : t('requestLast')),
            el('p', {}, session.prompt === '' ? t('noRequests') : session.prompt),
            tool === null ? null : el('span', { className: 'command' }, `${tool.tool} ${tool.summary}`),
          ),
          el(
            'div',
            { className: 'stats' },
            contextStat(session),
            stat(t('sessionCost'), session.costUsd === null ? '—' : formatUsd(session.costUsd)),
            stat(t('turns'), String(session.turns)),
            stat(t('outputTokens'), formatTokens(totalUsage(session).output)),
          ),
          el('div', { className: 'block' }, el('h3', {}, t('subagents')), agentsTable(session)),
          el('div', { className: 'block' }, el('h3', {}, t('tokensByModel')), usageTable(session)),
        )
      }

      const emptyLogText = (session, agent) => {
        if (session === undefined) {
          return t('pickSessionLog')
        }

        return agent === undefined ? t('noToolsYet') : t('agentNoToolsYet')
      }

      const renderLog = (session, agent) => {
        const target = document.getElementById('log')
        const entries = agent?.recent ?? session?.recent ?? []
        document.getElementById('log-session').textContent = agent === undefined ? session?.project ?? '' : `${session.project} · ${agent.type}`

        if (entries.length === 0) {
          target.replaceChildren(el('p', { className: 'empty' }, emptyLogText(session, agent)))

          return
        }

        target.replaceChildren(
          el(
            'ol',
            { className: 'log' },
            entries.slice(0, LOG_LIMIT).map(entry =>
              el(
                'li',
                { className: entry.isError ? 'failed' : null },
                el('time', { datetime: new Date(entry.at).toISOString(), title: formatWhen(entry.at) }, formatClock(entry.at)),
                el(
                  'div',
                  { style: { minWidth: '0' } },
                  el(
                    'div',
                    { className: 'log-head' },
                    el('span', { className: 'log-tool' }, entry.tool),
                    agent === undefined ? el('span', { className: 'chip' }, entry.agent) : null,
                    entry.isError ? el('span', { className: 'log-failure' }, t('logFailed')) : null,
                  ),
                  el('span', { className: 'command', title: entry.summary }, entry.summary),
                ),
              ),
            ),
          ),
        )
      }

      const hasTextSelection = () => {
        const selection = window.getSelection()

        return selection !== null && !selection.isCollapsed
      }

      const captureScroll = () => ({
        pageY: window.scrollY,
        boxes: [...document.querySelectorAll('[data-scroll-key]')].map(box => [box.dataset.scrollKey, box.scrollLeft]),
      })

      const restoreScroll = ({ pageY, boxes }) => {
        for (const [key, left] of boxes) {
          const box = document.querySelector(`[data-scroll-key="${key}"]`)

          if (box !== null) {
            box.scrollLeft = left
          }
        }

        if (window.scrollY !== pageY) {
          window.scrollTo({ top: pageY, behavior: 'instant' })
        }
      }

      const render = () => {
        const focusedSession = document.activeElement?.dataset?.session ?? null
        const focusedAgent = document.activeElement?.dataset?.agent ?? null
        const isBackFocused = document.activeElement?.dataset?.back !== undefined
        const scroll = captureScroll()
        const sessions = sortSessions(state.sessions)

        if (!sessions.some(session => session.id === state.selectedId)) {
          state.selectedId = sessions[0]?.id ?? null
        }

        const selected = sessions.find(session => session.id === state.selectedId)
        const selectedAgent = selected?.agents.find(agent => agent.id === state.selectedAgentId)

        if (selectedAgent === undefined) {
          state.selectedAgentId = null
        }

        renderHeader(sessions)
        renderKpis(sessions)
        renderSessions(sessions)
        renderCharts(sessions)
        renderTimeline(sessions)
        renderDetail(selected, selectedAgent)
        renderLog(selected, selectedAgent)

        if (focusedSession !== null) {
          document.querySelector(`[data-session="${CSS.escape(focusedSession)}"]`)?.focus({ preventScroll: true })
        }

        if (focusedAgent !== null) {
          document.querySelector(`[data-agent="${CSS.escape(focusedAgent)}"]`)?.focus({ preventScroll: true })
        }

        if (isBackFocused) {
          document.querySelector('[data-back]')?.focus({ preventScroll: true })
        }

        restoreScroll(scroll)
      }

      const showNotice = message => {
        document.getElementById('notice').replaceChildren(message === null ? '' : el('p', { className: 'notice' }, message))
      }

      const poll = async () => {
        try {
          const response = await fetch('/api/sessions', { cache: 'no-store' })

          if (!response.ok) {
            throw new Error(t('serverResponded', response.status))
          }

          const body = await response.json()
          state.sessions = body.sessions.map(normalizeSession)
          state.now = body.now
          state.hasLoaded = true
          showNotice(null)

          if (!hasTextSelection()) {
            render()
          }
        } catch (error) {
          showNotice(t('connectionLost', error.message))
        } finally {
          setTimeout(poll, POLL_MS)
        }
      }

      const languageSelect = document.getElementById('language-select')
      const themeSelect = document.getElementById('theme-select')

      const changeLanguage = selected => {
        language = selected
        locale = LOCALES[selected]
        document.documentElement.lang = selected
        storePreference(LANGUAGE_STORAGE_KEY, selected)
        const url = new URL(location.href)
        url.searchParams.set('lang', selected)
        history.replaceState(null, '', url)
        applyStaticTexts()

        if (state.hasLoaded) {
          render()
        }
      }

      const changeTheme = selected => {
        themePreference = selected
        storePreference(THEME_STORAGE_KEY, selected)
        applyTheme()
      }

      languageSelect.value = language
      themeSelect.value = themePreference
      languageSelect.addEventListener('change', () => changeLanguage(languageSelect.value))
      themeSelect.addEventListener('change', () => changeTheme(themeSelect.value))

      applyStaticTexts()
      poll()
    </script>
  </body>
</html>
